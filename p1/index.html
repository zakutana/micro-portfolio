<!doctype html>
<html lang="cs" data-id="p1" data-theme="waddle">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#3a56d8">
  <title>Micro portfolio</title>
  <link rel="stylesheet" href="../assets/style.css?v=mutk2q6e">
  <script src="../assets/icons.js?v=mutk2q6e"></script>
  <script src="../assets/app.js?v=mutk2q6e"></script>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <span class="brand-mark" id="brand-mark" aria-hidden="true"></span>
        <h1 class="title">Micro portfolio</h1>
      </div>
      <div class="header-tools" id="tools">
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Změnit motiv" aria-expanded="false" aria-controls="themes"></button>
      </div>
      <nav class="themes" id="themes" aria-label="Motiv stránky" hidden></nav>
    </header>

    <div class="stage" id="stage">
      <div class="mascot" id="mascot" aria-hidden="true"></div>

      <section class="panel lock" id="lock" hidden>
        <div class="lock-icon" aria-hidden="true">🔒</div>
        <h2>Tahle stránka je jen pro tebe</h2>
        <p>Otevři ji naskenováním QR kódu na své kartičce.</p>
      </section>

      <main id="content" hidden>
        <h2 class="section-title">Moje věci</h2>
        <ul class="list" id="list"></ul>
      </main>
    </div>

    <div class="spacer"></div>
    <p class="status" id="status" aria-live="polite"></p>

    <footer class="total" id="total-bar" aria-live="polite" hidden>
      <span class="total-icon" id="total-icon" aria-hidden="true"></span>
      <span class="total-label">Celkem</span>
      <span class="total-value" id="total">…</span>
    </footer>
  </div>
</body>
</html>
